<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>YouTube Music Presence</title>

    <style>
        body {
            width: 280px;
            margin: 0;
            padding: 20px;
            background: #181818;
            color: white;
            font-family: Arial, sans-serif;
        }

        h2 {
            margin-top: 0;
            font-size: 18px;
        }

        .status {
            padding: 10px;
            border-radius: 8px;
            background: #242424;
            margin-top: 12px;
        }

        .dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #777;
            margin-right: 6px;
        }
    </style>
</head>

<body>

    <h2>🎵 YouTube Music</h2>

    <div class="status">
        <span class="dot"></span>
        Discord Presence
    </div>

    <p>
        Play a song on YouTube Music to update Discord.
    </p>

</body>
</html>
